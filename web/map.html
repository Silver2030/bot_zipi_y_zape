<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa WarEra — Zipi y Zape</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; background: #0f1115; color: #e7e9ee; }
  #map { position: absolute; inset: 0; z-index: 0; }

  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    background: rgba(20,22,28,0.92); border: 1px solid #2a2e38; border-radius: 10px;
    padding: 12px 14px; max-width: 320px; backdrop-filter: blur(4px);
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
  }
  #panel h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab {
    flex: 1; text-align: center; padding: 6px 8px; border-radius: 7px; cursor: pointer;
    background: #1c1f27; border: 1px solid #2a2e38; font-size: 13px; user-select: none;
  }
  .tab.active { background: #3b6fd6; border-color: #3b6fd6; color: #fff; }
  .stat-row { display: flex; justify-content: space-between; font-size: 12.5px; color: #aab0bd; padding: 2px 0; }
  .stat-row b { color: #e7e9ee; }
  #warning {
    font-size: 12px; line-height: 1.4; background: #3a2a12; border: 1px solid #6b4d1a;
    color: #ffd899; padding: 8px 10px; border-radius: 7px; margin-top: 8px; display: none;
  }
  #loading { font-size: 12px; color: #8890a0; margin-top: 6px; }

  .leaflet-popup-content-wrapper { background: #181b22; color: #e7e9ee; border-radius: 8px; }
  .leaflet-popup-tip { background: #181b22; }
  .popup-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .popup-sub { font-size: 12px; color: #9aa1b1; margin-bottom: 6px; }
  .popup-players { max-height: 180px; overflow-y: auto; font-size: 12.5px; }
  .popup-players div { padding: 2px 0; border-bottom: 1px solid #262a33; }
  .popup-players div:last-child { border-bottom: none; }
  .away { color: #ffb454; }
  .home { color: #6ee7b7; }

  .marker-cluster { background-clip: padding-box; }
  .marker-cluster div {
    background: rgba(59,111,214,0.85); color: #fff; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; width: 100%; height: 100%;
  }
  .region-tooltip {
    background: #181b22; color: #e7e9ee; border: 1px solid #2a2e38;
    font-size: 12px; padding: 3px 7px;
  }
  .region-tooltip::before { display: none; }

  #legend {
    position: absolute; bottom: 12px; left: 12px; z-index: 1000;
    background: rgba(20,22,28,0.92); border: 1px solid #2a2e38; border-radius: 10px;
    padding: 8px 12px; font-size: 12px; color: #aab0bd; max-width: 260px;
  }
</style>
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <h1>🗺️ Mapa WarEra</h1>
    <div class="tabs">
      <div class="tab active" data-mode="residentes">Residentes</div>
      <div class="tab" data-mode="poblacion">Población</div>
      <div class="tab" data-mode="rastreados">Rastreados</div>
    </div>
    <div class="stat-row"><span>Regiones</span><b id="statRegions">–</b></div>
    <div class="stat-row"><span>Jugadores rastreados</span><b id="statTracked">–</b></div>
    <div class="stat-row"><span>Regiones con rastreados</span><b id="statTrackedRegions">–</b></div>
    <div id="loading"></div>
    <div id="warning"></div>
  </div>

  <div id="legend">
    <div><span style="color:#6ee7b7">●</span> En su región de residencia</div>
    <div><span style="color:#ffb454">●</span> Fuera de su región de residencia</div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="https://unpkg.com/d3-delaunay@6/dist/d3-delaunay.min.js"></script>
<script>
(function () {
  "use strict";

  const params  = new URLSearchParams(location.search);
  const chatId  = params.get("chatId");
  const token   = params.get("token");
  const hasAuth = !!(chatId && token);

  const map = L.map("map", { worldCopyJump: true, minZoom: 2, maxZoom: 12, zoomSnap: 0.5 }).setView([30, 10], 3);

  // Capa política: no tenemos los polígonos exactos de cada región (la API
  // solo da un punto lat/lng), así que aproximamos su "territorio" con un
  // diagrama de Voronoi a partir de esos puntos, coloreado por el país que
  // controla cada región en el juego. Se recorta a la silueta de tierra real
  // (mismo "countries" de world-atlas) para que el color no se salga al mar.
  // Voronoi y silueta comparten el mismo pane (mismo renderer/SVG) para que
  // sus coordenadas siempre coincidan exactamente al recortar.
  map.createPane("politicalPane");
  map.getPane("politicalPane").style.zIndex = 350;

  let landLayer = null;
  const clipSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  clipSvg.setAttribute("width", "0");
  clipSvg.setAttribute("height", "0");
  clipSvg.style.position = "absolute";
  clipSvg.innerHTML = '<defs><clipPath id="landClip"></clipPath></defs>';
  document.body.appendChild(clipSvg);
  const clipPathEl = clipSvg.querySelector("#landClip");

  function syncLandClip() {
    if (!landLayer) return;
    clipPathEl.innerHTML = "";
    landLayer.eachLayer((l) => {
      const d = l._path && l._path.getAttribute("d");
      if (!d) return;
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", d);
      clipPathEl.appendChild(p);
    });
    // Se aplica como atributo del <svg> interno del pane (no del div del
    // pane): así el recorte usa exactamente el mismo espacio de coordenadas
    // que los propios trazados (el svg de Leaflet va desplazado respecto al
    // div contenedor, y aplicarlo en el div desalineaba el recorte).
    const svg = map.getPane("politicalPane")?.querySelector("svg");
    if (svg) svg.setAttribute("clip-path", "url(#landClip)");
  }
  // rAF: esperar a que Leaflet termine de recalcular los trazados del propio
  // evento (sus listeners internos corren en el mismo ciclo) antes de leer
  // su "d" -- si no, se copia la posición vieja y todo queda desalineado.
  map.on("zoomend moveend", () => requestAnimationFrame(syncLandClip));

  // Un anillo cuya longitud salta de golpe (p.ej. de 179° a -179°) cruza el
  // antimeridiano sin estar partido en el dataset; tal cual, Leaflet lo
  // dibuja como una raya recta atravesando todo el mapa. Se descarta ese
  // anillo/subpolígono en vez de arriesgarse a pintarlo mal.
  function crossesAntimeridian(ring) {
    for (let i = 1; i < ring.length; i++) {
      if (Math.abs(ring[i][0] - ring[i - 1][0]) > 180) return true;
    }
    return false;
  }
  function dropAntimeridianRings(fc) {
    const features = [];
    for (const f of fc.features) {
      const g = f.geometry;
      if (!g) continue;
      if (g.type === "Polygon") {
        if (!crossesAntimeridian(g.coordinates[0])) features.push(f);
      } else if (g.type === "MultiPolygon") {
        const polys = g.coordinates.filter((poly) => !crossesAntimeridian(poly[0]));
        if (polys.length) features.push({ ...f, geometry: { type: "MultiPolygon", coordinates: polys } });
      } else {
        features.push(f);
      }
    }
    return { type: "FeatureCollection", features };
  }

  // Colores por "scheme" (color real del país en el juego, no inventado).
  // No conocemos la paleta exacta del juego, así que usamos una equivalente
  // por nombre; si llega un scheme que no reconocemos, se cae a un color
  // derivado del id (mejor eso que sin color).
  const SCHEME_COLORS = {
    red: "#e5484d", tomato: "#e54d2e", ruby: "#e54666", crimson: "#e93d82",
    orange: "#f76b15", amber: "#ffb224", gold: "#c8a355", yellow: "#f5d90a",
    lime: "#bdee63", grass: "#65ba74", green: "#30a46c", lightgreen: "#5bb98c",
    darkgreen: "#1f6f4a", jade: "#29a383", mint: "#4ccbc9", teal: "#12a594",
    cyan: "#00a2c7", sky: "#5eb1ef", lightblue: "#5eb1ef", blue: "#0090ff",
    darkblue: "#1c4e91", indigo: "#3e63dd", iris: "#5b5bd6", violet: "#8e4ec6",
    purple: "#8e4ec6", plum: "#ab4aba", pink: "#d6409f", magenta: "#d6409f",
    brown: "#ad7f58", bronze: "#a18072", sand: "#8d8d86", gray: "#8b8d98",
    grey: "#8b8d98", slate: "#697177", mauve: "#8e8c99", olive: "#8f9779",
    black: "#2b2b2b", white: "#e8e8e8", navy: "#2a4a7c", maroon: "#8c3a3a",
    turquoise: "#0cc0df",
  };
  function colorForScheme(scheme, fallbackId) {
    const key = String(scheme || "").toLowerCase().replace(/[^a-z]/g, "");
    if (SCHEME_COLORS[key]) return SCHEME_COLORS[key];
    let hash = 0;
    const s = String(fallbackId || scheme || "");
    for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
    return `hsl(${hash % 360}, 65%, 55%)`;
  }

  function buildVoronoiLayer() {
    const regionsArr = [...regionsById.values()].filter((r) => Array.isArray(r.position));
    const points = regionsArr.map((r) => r.position); // [lng, lat]
    const delaunay = d3.Delaunay.from(points);
    const voronoi = delaunay.voronoi([-180, -75, 180, 84]);

    const features = [];
    regionsArr.forEach((r, i) => {
      const cell = voronoi.cellPolygon(i);
      if (!cell || crossesAntimeridian(cell)) return;
      features.push({
        type: "Feature",
        properties: { country: r.country, scheme: r.countryScheme },
        geometry: { type: "Polygon", coordinates: [cell] },
      });
    });

    L.geoJSON(
      { type: "FeatureCollection", features },
      {
        style: (f) => ({
          pane: "politicalPane",
          stroke: false,
          fillColor: colorForScheme(f.properties.scheme, f.properties.country),
          fillOpacity: 0.55,
        }),
        interactive: false,
      }
    ).addTo(map);
  }

  fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json")
    .then((r) => r.json())
    .then((topology) => {
      const countries = dropAntimeridianRings(topojson.feature(topology, topology.objects.countries));
      landLayer = L.geoJSON(countries, {
        style: { pane: "politicalPane", color: "#0f1115", weight: 0.6, fillOpacity: 0 },
        interactive: false,
      }).addTo(map);
      syncLandClip();
    })
    .catch(() => {});

  let regionsById = new Map();
  let trackedByRegion = new Map(); // regionId -> [{userId, username, isHome}]
  let trackedTotal = 0;
  let mode = "residentes";

  function clusterIconFor(cluster) {
    const sum = cluster.getAllChildMarkers().reduce((acc, m) => acc + (m.regionValue || 0), 0);
    const size = Math.max(30, Math.min(70, 22 + 9 * Math.sqrt(sum)));
    return L.divIcon({
      html: `<div>${sum.toLocaleString("es-ES")}</div>`,
      className: "marker-cluster",
      iconSize: L.point(size, size),
    });
  }

  let layerGroup = L.markerClusterGroup({
    maxClusterRadius: 45,
    disableClusteringAtZoom: 7,
    spiderfyOnMaxZoom: true,
    iconCreateFunction: clusterIconFor,
  }).addTo(map);

  const warningEl = document.getElementById("warning");
  const loadingEl = document.getElementById("loading");

  function setLoading(text) { loadingEl.textContent = text || ""; }
  function showWarning(text) { warningEl.style.display = "block"; warningEl.textContent = text; }

  // Si algo revienta (aquí o en cualquier script cargado), que se vea en la
  // página en vez de quedar en blanco sin pistas.
  window.addEventListener("error", (e) => showWarning("Error: " + (e.error?.message || e.message)));
  window.addEventListener("unhandledrejection", (e) => showWarning("Error: " + (e.reason?.message || e.reason)));

  async function loadRegions() {
    setLoading("Cargando regiones…");
    const res = await fetch("/api/map/regions");
    if (!res.ok) throw new Error("No se pudieron cargar las regiones");
    const { regions } = await res.json();
    regions.forEach((r) => regionsById.set(r.id, r));
    document.getElementById("statRegions").textContent = regions.length;
    buildVoronoiLayer();
    setLoading("");
  }

  async function loadTracked() {
    if (!hasAuth) {
      showWarning("Este enlace no incluye tu chat. Usa /mapa en tu chat de Telegram para obtener tu enlace personalizado y ver a tus rastreados.");
      return;
    }
    setLoading("Cargando rastreados…");
    const res = await fetch(`/api/map/tracked?chatId=${encodeURIComponent(chatId)}&token=${encodeURIComponent(token)}`);
    if (res.status === 403) { showWarning("El enlace no es válido para este chat. Pide uno nuevo con /mapa."); setLoading(""); return; }
    if (!res.ok) { showWarning("Error al cargar los jugadores rastreados."); setLoading(""); return; }

    const { players } = await res.json();
    trackedByRegion = new Map();
    trackedTotal = players.length;

    players.forEach((p) => {
      const regionId = p.locationRegionId;
      if (!regionId) return;
      if (!trackedByRegion.has(regionId)) trackedByRegion.set(regionId, []);
      trackedByRegion.get(regionId).push({
        userId: p.userId,
        username: p.username,
        isHome: p.homeRegionId === p.locationRegionId,
      });
    });

    document.getElementById("statTracked").textContent = trackedTotal;
    document.getElementById("statTrackedRegions").textContent = trackedByRegion.size;
    setLoading("");
  }

  function renderByField(field, label) {
    layerGroup.clearLayers();
    const maxVal = Math.max(1, ...[...regionsById.values()].map((r) => r[field] || 0));

    regionsById.forEach((r) => {
      if (!r.position) return;
      const val = r[field] || 0;
      const radius = 4 + 13 * Math.sqrt(val / maxVal);
      const marker = L.circleMarker([r.position[1], r.position[0]], {
        radius,
        color: r.isCapital ? "#ffd75e" : "#111319",
        fillColor: "#f2f2f2",
        fillOpacity: 0.9,
        weight: r.isCapital ? 2 : 1,
      });
      marker.regionValue = val;
      marker.bindTooltip(`${escapeHtml(r.name)} — ${val}`, { direction: "top", className: "region-tooltip" });
      marker.bindPopup(
        `<div class="popup-title">${escapeHtml(r.name)}${r.isCapital ? " 👑" : ""}</div>` +
        `<div class="popup-sub">${escapeHtml(r.countryName || "")} · ${escapeHtml(r.mainCity || "")}</div>` +
        `<div>${label}: <b>${val}</b></div>`
      );
      layerGroup.addLayer(marker);
    });
  }

  function renderRastreados() {
    layerGroup.clearLayers();
    if (!trackedByRegion.size) return;

    const maxCount = Math.max(1, ...[...trackedByRegion.values()].map((arr) => arr.length));

    trackedByRegion.forEach((players, regionId) => {
      const r = regionsById.get(regionId);
      if (!r || !r.position) return;
      const radius = 6 + 14 * Math.sqrt(players.length / maxCount);
      const anyAway = players.some((p) => !p.isHome);

      const marker = L.circleMarker([r.position[1], r.position[0]], {
        radius,
        color: anyAway ? "#ffb454" : "#6ee7b7",
        fillColor: "#f2f2f2",
        fillOpacity: 0.9,
        weight: 3,
      });
      marker.regionValue = players.length;
      marker.bindTooltip(`${escapeHtml(r.name)} — ${players.length} rastreado(s)`, { direction: "top", className: "region-tooltip" });

      const rows = players
        .sort((a, b) => a.username.localeCompare(b.username))
        .map((p) => `<div class="${p.isHome ? "home" : "away"}">${p.isHome ? "🏠" : "➡️"} <a href="https://app.warera.io/user/${p.userId}" target="_blank" rel="noopener" style="color:inherit">${escapeHtml(p.username)}</a></div>`)
        .join("");

      marker.bindPopup(
        `<div class="popup-title">${escapeHtml(r.name)}</div>` +
        `<div class="popup-sub">${escapeHtml(r.countryName || "")} · ${players.length} rastreado(s)</div>` +
        `<div class="popup-players">${rows}</div>`
      );
      layerGroup.addLayer(marker);
    });
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function render() {
    if (mode === "residentes") renderByField("residents", "Residentes");
    else if (mode === "poblacion") renderByField("population", "Población");
    else renderRastreados();
  }

  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      mode = tab.dataset.mode;
      render();
    });
  });

  (async function init() {
    try {
      await loadRegions();
      await loadTracked();
      render();
      if (hasAuth) {
        setInterval(async () => { await loadTracked(); if (mode === "rastreados") render(); }, 60_000);
      }
    } catch (err) {
      showWarning("Error: " + err.message);
    }
  })();
})();
</script>
</body>
</html>
